services:
  actual:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    expose:
    - "5006"
    environment:
      ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: "20"
      ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: "50"
    volumes:
    - actual-data:/data
    healthcheck:
      test:
      - "CMD-SHELL"
      - "node src/scripts/health-check.js"
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: '268435456'
          cpus: 0.25
        reservations: {}
    mem_limit: 268435456
    memswap_limit: 268435456
    cpus: 0.25
volumes:
  actual-data:
